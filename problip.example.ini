[problip]
; Example configuration. Copy to problip.ini beside Problip.exe to use.
; The app creates this file with these defaults on first run if it is missing.
Volume=0.05
; Ordinary Range preset bounds (milliseconds). These stay the ACTIVE Range
; values even while another interval mode is selected, so switching back to a
; preset never re-derives anything.
MinMs=4000
MaxMs=7000
; Interval mode: range (the MinMs/MaxMs preset above), manual (the
; ManualFromSec/ManualToSec bounds below), or pulse (built-in 5 s short slot
; alternating with a fresh random 10-20 s long slot). An old ini without this
; key behaves as range.
IntervalKind=range
; MANUAL bounds in seconds (1-3600). Clamped into range and reordered so
; FROM <= TO; equal bounds behave as a fixed interval.
ManualFromSec=4
ManualToSec=7
; Autostart is opt-in: 0 means Problip does not register itself in the
; Windows Run key. Toggle it in the app UI or set 1 here to enable.
AutoStart=0
; Whether launching Problip arms the periodic beeper (1) or starts paused (0).
; Distinct from AutoStart: this decides what the app does once it runs.
; Remembered across restarts; default 1 preserves the original behavior.
RunOnLaunch=1
; Whether the compact "BLIPS n" total line is shown in the settings window.
; Purely visibility: hiding it never stops statistics from being recorded.
; Statistics themselves live in a separate file, problip.stats.ini.
ShowBlipCounter=1
; Selected theme. One of: theme_classic (Golden Default, the default),
; theme_wintage_golden, theme_wintage_claudecode, theme_wintage_antigravity,
; theme_wintage_klite, theme_wintage_freebuff, theme_wintage_codenomad,
; theme_wintage_fpdefault, theme_wintage_goldenvintage,
; theme_wintage_vintagedark, theme_wintage_vintageclassic,
; theme_wintage_oled, theme_wintage_dracula, theme_wintage_nord,
; theme_wintage_solarized. An old ini without this key (or any unknown value)
; behaves as theme_classic; the legacy theme_wintage_custom also resolves to it.
ThemeId=theme_classic
; Whether a successful scheduled blip softly tints the main window with the
; current theme's accent for a moment (Blip Glow). Default 1 (on); only an
; exact 0 turns it off. Preview/TEST blips never glow.
BlipGlow=1
